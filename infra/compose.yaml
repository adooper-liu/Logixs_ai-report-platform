# Development-only topology. Resolve image digests first; missing values fail closed.
name: ai-report-platform
x-control-env: &control-env
  APP_ENV: development
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate independent development secrets}
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
  CONTROL_DATABASE_URL: postgresql://control_app:${CONTROL_APP_PASSWORD:?Required}@db:5432/control
  REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
  BLOB_BACKEND: local
  BLOB_ROOT: /var/lib/arp/objects
  AI_ENABLED: "false"
  AI_ALLOW_RAW_SAMPLE_EGRESS: "false"
x-control-build: &control-build
  context: ..
  dockerfile: infra/control.Dockerfile
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:?Resolve immutable images with tools/resolve_images.py}
services:
  db:
    image: ${POSTGRES_IMAGE:?Resolve immutable images with tools/resolve_images.py}
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: postgres
      CONTROL_OWNER_PASSWORD: ${CONTROL_OWNER_PASSWORD:?Required}
      CONTROL_APP_PASSWORD: ${CONTROL_APP_PASSWORD:?Required}
      WAREHOUSE_OWNER_PASSWORD: ${WAREHOUSE_OWNER_PASSWORD:?Required}
      SUPERSET_OWNER_PASSWORD: ${SUPERSET_OWNER_PASSWORD:?Required}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-platform.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:?Resolve immutable images with tools/resolve_images.py}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: *control-build
    image: ai-report-platform-control:local
    environment:
      <<: *control-env
      CONTROL_DATABASE_URL: postgresql://control_owner:${CONTROL_OWNER_PASSWORD:?Required}@db:5432/control
    command: ["python", "-I", "-m", "arp_control.cli", "migrate", "--noinput"]
    depends_on:
      db: {condition: service_healthy}
  control:
    build: *control-build
    image: ai-report-platform-control:local
    environment: *control-env
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes: ["blob-data:/var/lib/arp/objects"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"]
      interval: 30s
      timeout: 12s
      retries: 3
volumes:
  postgres-data:
  redis-data:
  blob-data:
