[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-report-platform"
version = "0.1.0"
description = "Independent deterministic reporting platform control plane"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[project.scripts]
arp-control = "arp_control.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
where = ["apps/control", "packages/contracts"]
include = ["arp_control*", "arp_contracts*"]

[tool.setuptools.package-data]
arp_contracts = ["schemas/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
